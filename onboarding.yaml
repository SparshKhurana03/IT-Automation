# -----------------------------------------------------------------------------
# Employee onboarding workflow configuration
# Business rules and execution settings only.
# Field mappings are maintained separately in servicedesk-entra-mapping.yaml.
# -----------------------------------------------------------------------------

schema_version: "1.0"
workflow_type: employee_onboarding

configuration:
  field_mapping_file: "servicedesk-entra-mapping.yaml"

defaults:
  domain: sonacomstar.com
  usage_location: IN
  country_or_region: India
  user_type: Member
  account_enabled: true
  preferred_language: en-US

servicedesk:
  provider: servicedesk_plus

  base_url: "https://servicedesksonacomstarcom-sonagroup.msappproxy.net"

  auth: basic

  ticket_path: "/api/v3/requests/{ticket_id}"
  comment_path: "/api/v3/requests/{ticket_id}/notes"

  credentials:
    username_env: SDP_USERNAME
    password_env: SDP_PASSWORD

  accepted_request_for:
    - Email ID only
    - Email ID + Asset

  approved_statuses:
    - Approved
    - Implementation Approved

transformations:
  normalize_names:
    trim: true
    collapse_whitespace: true
    title_case: true

  display_name:
    expression: "join_non_empty([first_name, middle_name, last_name], ' ')"

  mail_nickname:
    expression: "sanitize(lower(first_name + '.' + last_name))"
    allowed_pattern: "[a-z0-9._-]"

  user_principal_name:
    expression: "mail_nickname + '@' + defaults.domain"
    duplicate_resolution: append_sequence_number

  mail:
    expression: "user_principal_name"

  job_title:
    expression: "designation"

  grade_extension_attribute:
    expression: "grade"

  street_address:
    source_precedence:
      - company_address
      - site_address_lookup

  office_location:
    source_precedence:
      - location
      - site

  password:
    generate_at_runtime: true
    minimum_length: 20
    store_plaintext: false
    log_value: false
    force_change_password_next_sign_in: true

graph:
  api_version: v1.0
  base_url: "https://graph.microsoft.com/v1.0"

  operations:

    duplicate_employee_check:
      method: GET
      path: "/users?$filter=employeeId eq '{staff_no}'&$select=id,userPrincipalName,employeeId,accountEnabled"

    duplicate_upn_check:
      method: GET
      path: "/users/{user_principal_name}?$select=id,userPrincipalName"
      not_found_is_success: true

    create_user:
      method: POST
      path: "/users"

    resolve_manager:
      method: GET
      path: "/users/{reporting_manager}?$select=id,mail,userPrincipalName,accountEnabled"

    assign_manager:
      method: PUT
      path: "/users/{new_user_id}/manager/\$ref"
      body:
        "@odata.id": "https://graph.microsoft.com/v1.0/users/{manager_id}"

graph_create_user_payload:

  accountEnabled: "{{ defaults.account_enabled }}"

  displayName: "{{ derived.display_name }}"
  givenName: "{{ first_name }}"
  surname: "{{ last_name }}"

  mailNickname: "{{ derived.mail_nickname }}"
  userPrincipalName: "{{ derived.user_principal_name }}"
  mail: "{{ derived.mail }}"

  passwordProfile:
    password: "{{ runtime.generated_password }}"
    forceChangePasswordNextSignIn: true

  userType: "{{ defaults.user_type }}"

  jobTitle: "{{ designation }}"

  companyName: "{{ company_name }}"
  department: "{{ department_name }}"

  employeeId: "{{ staff_no }}"
  employeeType: "{{ employee_type }}"
  employeeHireDate: "{{ employee_hire_date }}"

  officeLocation: "{{ location }}"

  streetAddress: "{{ company_address }}"
  city: "{{ city }}"
  state: "{{ state_or_province }}"
  postalCode: "{{ postal_code }}"

  country: "{{ country_or_region | default('India') }}"

  businessPhones:
    - "{{ phone_number }}"

  mobilePhone: "{{ mobile_phone }}"
  otherMails: "{{ other_mails }}"
  faxNumber: "{{ fax_number }}"

  ageGroup: "{{ age_group }}"
  consentProvidedForMinor: "{{ consent_provided_for_minor }}"

  usageLocation: "{{ usage_location | default('IN') }}"
  preferredLanguage: "{{ preferred_language | default(defaults.preferred_language) }}"

  onPremisesExtensionAttributes:
    extensionAttribute1: "{{ grade }}"
    extensionAttribute2: "{{ department_head }}"
    extensionAttribute3: "{{ roles_and_responsibility }}"

validation:

  required_sdp_fields:
    - request_for
    - status
    - first_name
    - last_name
    - designation
    - department_name
    - reporting_manager
    - staff_no
    - company_name
    - location

  allowed_employee_types:
    - Employee
    - Contractor
    - Consultant
    - Trainee
    - Intern

  rules:

    - name: approved_ticket_only
      expression: "status in servicedesk.approved_statuses"
      error: "The SDP request is not approved for provisioning."

    - name: supported_request_type
      expression: "request_for in servicedesk.accepted_request_for"
      error: "Unsupported Request For value."

    - name: manager_email_required
      expression: "is_valid_email(reporting_manager)"
      error: "Reporting Manager must contain a valid Entra email or UPN."

    - name: duplicate_employee_not_allowed
      expression: "duplicate_employee_count == 0"
      error: "An Entra user already exists with the supplied Staff Number."

processing:

  remove_null_optional_properties: true

  idempotency_key: "EMPLOYEE_ONBOARDING:{ticket_id}:{staff_no}"

  redact_in_logs:
    - passwordProfile.password
    - servicedesk.credentials

  retry_policy:
    maximum_attempts: 4
    retryable_http_status_codes:
      - 429
      - 500
      - 502
      - 503
      - 504

    honor_retry_after_header: true
    initial_delay_seconds: 10
    backoff_multiplier: 3
    maximum_delay_seconds: 300

  failure_policy:
    stop_on_validation_failure: true
    stop_when_manager_not_found: true
    rollback_created_user: false
    update_sdp_ticket: true

result:
  status: PENDING
  ticket_id: null
  correlation_id: null
  dag_run_id: null

  entra_object_id: null
  generated_user_principal_name: null
  manager_object_id: null

  completed_steps: []

  failed_step: null

  warnings: []

  error:
    code: null
    message: null
    retryable: null