description: Employee Onboarding Workflow

env:
  TICKET_ID: ""
  DRY_RUN: "false"

handlerOn:
  failure:
    command: >
      python3 /app/onboard.py error-report "$TICKET_ID"

steps:

  - name: fetch-ticket
    command: >
      python3 /app/onboard.py fetch "$TICKET_ID"

  - name: validate-ticket
    command: >
      python3 /app/onboard.py validate "$TICKET_ID"
    depends:
      - fetch-ticket

  - name: create-user
    command: >
      python3 /app/onboard.py create-user "$TICKET_ID"
    depends:
      - validate-ticket

  - name: assign-license
    command: >
      python3 /app/onboard.py assign-license "$TICKET_ID"
    depends:
      - create-user

  - name: add-groups
    command: >
      python3 /app/onboard.py add-groups "$TICKET_ID"
    depends:
      - assign-license

  - name: assign-rule-bundles
    command: >
      python3 /app/onboard.py assign-rule-bundles "$TICKET_ID"
    depends:
      - add-groups

  - name: assign-intune-apps
    command: >
      python3 /app/onboard.py assign-intune-apps "$TICKET_ID"
    depends:
      - assign-rule-bundles

  - name: generate-report
    command: >
      python3 /app/onboard.py generate-report "$TICKET_ID"
    depends:
      - assign-intune-apps

  - name: close-ticket
    command: >
      python3 /app/onboard.py close-ticket "$TICKET_ID"
    depends:
      - generate-report